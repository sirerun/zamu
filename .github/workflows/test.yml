name: Go contracts
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
env:
  # MISTT is a private module; git reads this read-only token for github.com/sirerun only.
  GOPRIVATE: github.com/sirerun/*
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: url.https://x-access-token:${{ secrets.SIRERUN_READ_TOKEN }}@github.com/sirerun/.insteadOf
  GIT_CONFIG_VALUE_0: https://github.com/sirerun/
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
      - run: go test -race -timeout 120s ./...
      - run: go vet ./...
      - name: Formatting
        run: test -z "$(gofmt -l .)"
